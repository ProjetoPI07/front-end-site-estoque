lacunas_do_prototipo:
  descricao: Telas e estados exigidos pela especificação que não possuem captura.
  itens:
    - Modal de detalhes da peça.
    - Modal de confirmação de baixa total (a captura mostra apenas a ação "Baixa total").
    - Lista de peças adicionadas dentro do cadastro de cobrança, com remoção.
    - Estado responsivo abaixo de 800 px (menu sobreposto, empilhamentos, tabela reduzida).
    - Tela de logout e retorno ao login.
    - Estado de quantidade com alteração pendente na tabela (salvar em destaque).
  diretriz: >
    Derivar das telas equivalentes: o cartão da cobrança segue as cores e medidas dos cartões de
    KPI e do painel, o formulário de cobrança reutiliza o card e os campos de Cadastrar peça, e o
    padrão de modal já usado no protótipo cobre as confirmações.

nota_de_sequencia: >
  A tarefa T-37 (tela de cadastro de cobrança, na fase F2) depende das tarefas T-35 e T-36 da fase
  F3, que concentram máscaras e validação. Executar T-35 e T-36 antes de T-37.

divergencias_para_confirmar:
  - Protótipo exibe "CÁPSULA CORP" e "© 2026 Capsula Corp" — o produto é Constru Móveis; substituir textos e aplicar o logo da pasta logos-do-site.
  - Protótipo exibe "Lembrar de mim" e "Esqueci minha senha" sem regra definida — manter visual, sem ação de recuperação de senha.
  - Protótipo exibe paginação ("1 2 3 … 26") com apenas 5 itens — decidir entre manter decorativa ou paginar de fato; recomendação: decorativa com a primeira página ativa.
  - Protótipo exibe sino de notificações — sem comportamento especificado; manter como elemento informativo.
  - Telas internas usam fundo #F3F6FA e o login usa #F8FAFC — ambos os valores entram como tokens distintos.
  - Capturas exibem telefone como "(11) 99912-3400", mas a regra pedida para o valor enviado é "(11)-94935-0142" — recomendação: exibir no padrão das capturas e normalizar com hífen apenas no valor entregue à camada de dados, conforme DA-09.
  - A captura de erro do cadastro de cobrança não mostra bordas vermelhas — a regra vigente exige borda vermelha em todos os campos inválidos (DA-08, DA-10).
  - O campo de data limite aparece com placeholder "mm/dd/yyyy", formato do navegador em inglês — o projeto é pt-BR; usar entrada de data com exibição dd/mm/aaaa.
  - O texto de sucesso da cobrança está alinhado nos três documentos como "Cobrança cadastrada com sucesso", sem exclamação, conforme a última instrução.
  - A especificação menciona vinculação de cobrança ao CPF/CNPJ do comprador, mas não define cadastro de clientes — os dados do comprador são digitados a cada cobrança.

estrutura_de_pastas:
  src/:
    main.jsx: ponto de entrada, importa estilos base
    App.jsx: provê contexto e rotas
    styles/:
      tokens.css: variáveis de cor, tipografia, espaçamento, raio e sombra
      base.css: reset, tipografia, foco visível, utilidades
    components/:
      layout/: Sidebar, Header, PageShell, HelpButton
      ui/: Button, TextField, SelectField, TextArea, DateField, Stepper, StatusPill, Badge, ProgressBar, Tabs, Toast, Modal, Card, Table, Dropdown, Avatar, Icon
      cobrancas/: CobrancaCard, ListaCobrancas, FormCobranca, ItensCobranca, ConfirmacaoBaixaTotal
      icons/: ícones SVG próprios
    pages/:
      Login/
      Estoque/
      CadastrarPeca/
      EditarPeca/
      Cobrancas/
      Dashboard/
    data/: seed de peças, categorias e cobranças
    context/: AuthContext, DadosContext
    utils/: mascaras, validacao, formatacao, status, cobrancas
  public/:
    fonts/: arquivos da fonte Inter
    brand/: logo ConstruMóveis recortado, versões clara e escura, favicon
  arquitetura/: este documento

fases:

  - id: F0
    nome: Fundação e sistema visual
    objetivo: Deixar o projeto pronto para receber telas, com tokens, marca e layout base.
    tarefas:

      - id: T-01
        titulo: Limpar o scaffold e criar a estrutura de pastas
        descricao: >
          Remover a demo do Vite (App.jsx atual, App.css, imagens de exemplo e seções da
          página inicial), criar as pastas previstas em estrutura_de_pastas e ajustar main.jsx e
          index.html para o produto (título e idioma pt-BR).
        entradas: [src/App.jsx, src/App.css, src/assets/, index.html]
        entregaveis:
          - Estrutura de pastas criada e vazia, pronta para os componentes.
          - index.html com título "Constru Móveis — Gestão de Estoque" e lang pt-BR.
        depende_de: []
        criterios_de_conclusao:
          - npm run dev sobe sem erros e sem conteúdo da demo.
          - npm run build conclui sem avisos de importação órfã.
        tamanho: P

      - id: T-02
        titulo: Criar tokens de design a partir das imagens
        descricao: >
          Escrever styles/tokens.css com as variáveis de cores_marca, cores_interface,
          tipografia, espacos, raios e sombras deste documento, e styles/base.css com reset,
          tipografia base de 19 px, foco visível e utilitários. Validar cada cor com conta-gotas
          sobre as capturas antes de fechar.
        entradas: [imgs-prototipo/, tokens_de_design]
        entregaveis:
          - tokens.css e base.css publicados.
          - Nenhum componente com valor de cor solto.
        depende_de: [T-01]
        criterios_de_conclusao:
          - Paleta confere com a amostragem das capturas.
          - Base tipográfica de 19 px aplicada ao conteúdo interno.
        tamanho: M

      - id: T-03
        titulo: Incluir a fonte Inter e os ícones do sistema
        descricao: >
          Adicionar os arquivos da Inter em public/fonts com as declarações @font-face e criar os
          ícones SVG necessários: caixa, mais, menos, lápis, gráfico, sino, sair, upload, olho,
          lupa, salvar, seta, check, fechar, interrogação e avatar genérico.
        entradas: [tipografia]
        entregaveis:
          - Fonte Inter servida localmente, sem dependência de CDN.
          - Conjunto de ícones reutilizáveis com espessura de traço próxima às capturas.
        depende_de: [T-02]
        criterios_de_conclusao:
          - Textos renderizam em Inter com o mesmo peso e espaçamento das imagens.
          - Ícones escalam sem perda e herdam cor por currentColor.
        tamanho: M

      - id: T-04
        titulo: Preparar os ativos da marca ConstruMóveis
        descricao: >
          Os dois arquivos de logos-do-site são páginas do manual de identidade com fundo verde
          sólido (#47704C), sem canal alfa. Remover o fundo, isolar o símbolo e o logotipo, gerar
          versão principal, versão clara para a sidebar escura, versão escura para fundo claro e
          favicon 32x32, salvando em public/brand.
        entradas: [logos-do-site/]
        entregaveis:
          - logo-constru-moveis.png (transparente), logo-claro.png, logo-escuro.png, favicon.
          - Registro do fundo removido e das versões geradas.
        depende_de: [T-01]
        criterios_de_conclusao:
          - Logo sem halo verde e com bordas limpas em fundo claro e escuro.
          - Favicon visível na aba do navegador.
        tamanho: M

      - id: T-05
        titulo: Construir o App Shell
        descricao: >
          Sidebar fixa de 252 px com marca, saudação, itens de navegação, item ativo azul, rodapé
          com Sair e versão; cabeçalho de 64 px com breadcrumb, sino, avatar, nome e perfil;
          área de conteúdo com padding de 32 px; botão flutuante de ajuda no canto inferior direito.
        entradas: [imgs-prototipo 17-11-29, imgs-prototipo 17-14-44]
        entregaveis:
          - Sidebar, Header e PageShell reutilizáveis.
        depende_de: [T-02, T-03, T-04]
        criterios_de_conclusao:
          - Em qualquer tela interna, sidebar e cabeçalho idênticos às capturas.
          - Item ativo reflete a rota atual e o breadcrumb muda junto.
        tamanho: G

      - id: T-06
        titulo: Criar a camada de dados em memória
        descricao: >
          Implementar data/seed com as cinco peças do estoque (Rolamento 6203, Correia Industrial
          A32, Filtro Hidráulico HF-10, Engrenagem Motriz Z24, Sensor de Proximidade), as três
          categorias, as cinco peças selecionáveis na edição e as cobranças iniciais. Expor
          DadosContext com ações de cadastrar, editar, ajustar quantidade, cadastrar cobrança,
          baixar parcela e baixa total.
        entradas: [specs/specs.yml (restricoes.dados), md_ConstruMoveis_atualizado.md]
        entregaveis:
          - seed.js, DadosContext.jsx e hooks de acesso.
        depende_de: [T-01]
        criterios_de_conclusao:
          - Telas leem e escrevem pelo contexto, sem estado duplicado.
          - Recarregar a página restaura o seed.
        tamanho: M

      - id: T-07
        titulo: Configurar rotas e guarda de sessão
        descricao: >
          Adicionar react-router-dom, definir /login, /estoque, /pecas/nova, /pecas/editar,
          /cobrancas e /dashboard, criar AuthContext e redirecionar para /login quando não houver
          sessão e para /estoque quando houver.
        entradas: [DA-04, specs/specs.yml (RF-01, RF-13)]
        entregaveis:
          - Router configurado e AuthContext com entrar e sair.
        depende_de: [T-05]
        criterios_de_conclusao:
          - Rota protegida acessada sem sessão leva ao login.
          - Login válido leva a /estoque; Sair volta a /login.
        tamanho: M

  - id: F1
    nome: Componentes base
    objetivo: Montar o kit de UI do protótipo antes de escrever as telas.
    tarefas:

      - id: T-08
        titulo: Campos de formulário
        descricao: >
          Criar TextField, SelectField e TextArea com rótulo acima, altura de 52 px, borda
          #E6ECF3, raio 10 px, foco azul com halo suave, estado de erro vermelho e placeholder
          cinza claro. O seletor da tela de edição usa fundo azul suave e texto azul quando tem
          valor.
        entradas: [imgs-prototipo 17-11-49, imgs-prototipo 17-11-52, imgs-prototipo 17-14-21]
        entregaveis:
          - Componentes com estados padrão, foco, preenchido, erro e desabilitado.
        depende_de: [T-02, T-03]
        criterios_de_conclusao:
          - Altura, borda, raio e halo de foco idênticos às capturas de erro e de sucesso.
          - Rótulo associado ao campo para leitores de tela.
        tamanho: M

      - id: T-09
        titulo: Botões
        descricao: >
          Criar Button com variantes primária (azul sólido), secundária (contorno claro), ícone e
          texto com ícone; alturas de 48 px, raio 10 px, pesos e espaçamentos conforme as capturas.
        entradas: [imgs-prototipo 17-14-02, imgs-prototipo 17-14-24]
        entregaveis: [Button.jsx e Button.css]
        depende_de: [T-02]
        criterios_de_conclusao:
          - Botões "Cancelar" e "Cadastrar peça" ficam com alinhamento e proporção iguais às imagens.
        tamanho: P

      - id: T-10
        titulo: Toasts de erro e sucesso
        descricao: >
          Criar Toast no canto superior direito, sobrepondo o cabeçalho, com barra lateral colorida,
          mensagem, ícone de fechar e sombra; variantes de erro (vermelho) e sucesso (verde); tempo
          de exibição e fechamento manual.
        entradas: [imgs-prototipo 17-11-52, imgs-prototipo 17-14-02, imgs-prototipo 17-04-38]
        entregaveis:
          - Toast.jsx, Toast.css e um hook/contexto para disparar mensagens.
        depende_de: [T-02, T-03]
        criterios_de_conclusao:
          - Mensagens exatas da especificação são exibidas sem truncamento.
          - Um toast por vez, sem empilhamento desalinhado.
        tamanho: M

      - id: T-11
        titulo: Modal
        descricao: >
          Criar Modal com overlay escurecido, card branco, título, conteúdo, ações e fechar; foco
          preso, fechamento por Esc e clique no overlay desabilitado quando a ação é destrutiva.
        entradas: [specs/specs.yml (RF-05, RF-11)]
        entregaveis: [Modal.jsx e Modal.css]
        depende_de: [T-09]
        criterios_de_conclusao:
          - Foco entra no modal ao abrir e volta ao gatilho ao fechar.
          - Não há rolagem de fundo enquanto aberto.
        tamanho: M

      - id: T-12
        titulo: Pills de status
        descricao: >
          Criar StatusPill com três variantes de estoque (em estoque azul suave, estoque baixo
          âmbar, crítico vermelho suave) e quatro de cobrança (aberta, próxima do vencimento,
          vencida, paga), com raio total e texto em caixa alta curta.
        entradas: [imgs-prototipo 17-11-29, cores_interface]
        entregaveis: [StatusPill.jsx e StatusPill.css]
        depende_de: [T-02]
        criterios_de_conclusao:
          - Cores de fundo e texto conferem com as capturas de cada status.
        tamanho: P

      - id: T-13
        titulo: Stepper de quantidade
        descricao: >
          Criar Stepper com botão de aumento à esquerda, valor central editável e botão de redução
          à direita, 38 px de altura, botões em azul suave com ícone azul, limite inferior zero e
          bloqueio de caracteres não numéricos.
        entradas: [imgs-prototipo 17-11-29, imgs-prototipo 17-11-49]
        entregaveis: [Stepper.jsx e Stepper.css]
        depende_de: [T-03]
        criterios_de_conclusao:
          - Aparência idêntica nas três ocorrências (tabela, cadastro, edição).
          - Não aceita decimais, negativos ou letras.
        tamanho: M

      - id: T-14
        titulo: Card de página e cabeçalho de seção
        descricao: >
          Criar Card (superfície branca, raio 16 px, borda sutil, sombra leve) e o bloco de
          cabeçalho de página com sobretítulo em caixa alta azul, título grande e subtítulo em
          cinza.
        entradas: [imgs-prototipo 17-11-29, imgs-prototipo 17-14-21]
        entregaveis: [Card.jsx, PageHeader.jsx e respectivos CSS]
        depende_de: [T-02]
        criterios_de_conclusao:
          - Espaçamento entre sobretítulo, título e subtítulo confere com as imagens.
        tamanho: P

      - id: T-15
        titulo: Tabela de peças com rodapé
        descricao: >
          Criar Table com cabeçalho em caixa alta cinza, linhas separadas por divisória clara,
          altura de 76 px, primeira coluna com ícone de caixa em quadrado azul suave, e rodapé com
          contagem à esquerda e paginação à direita.
        entradas: [imgs-prototipo 17-11-29, imgs-prototipo 17-11-38]
        entregaveis: [Table.jsx e Table.css]
        depende_de: [T-12, T-13]
        criterios_de_conclusao:
          - Larguras e alinhamentos das colunas idênticos às capturas.
          - Estado vazio centralizado com a mensagem especificada.
        tamanho: G

      - id: T-16
        titulo: Menu do usuário e sino de notificações
        descricao: >
          Criar o bloco de usuária do cabeçalho (avatar com iniciais, nome, perfil, chevron) e o
          sino com indicador de novidade, ambos sem regra de negócio associada.
        entradas: [imgs-prototipo 17-11-29]
        entregaveis: [UserMenu.jsx, NotificationBell.jsx]
        depende_de: [T-03, T-05]
        criterios_de_conclusao:
          - Elementos alinhados à direita do cabeçalho como nas capturas.
        tamanho: P

  - id: F2
    nome: Telas
    objetivo: Implementar as sete telas com o comportamento especificado.
    tarefas:

      - id: T-17
        titulo: Tela de Login
        descricao: >
          Implementar o layout de duas colunas: painel esquerdo escuro com gradiente, brilho
          radial, selo com logo, textos e copyright 2026; painel direito com sobretítulo, título,
          subtítulo, campo de identificação, campo de senha com olho, checkbox, link, botão Entrar
          e ajuda flutuante. Validar credenciais conforme a especificação e exibir o toast genérico
          de erro, marcando os dois campos. O campo de identificação aplica máscara de CPF quando a
          entrada contém apenas dígitos e mantém o texto quando há arroba.
        entradas: [imgs-prototipo 17-04-34, imgs-prototipo 17-04-38, imgs-prototipo 17-11-07, T-35]
        entregaveis: [pages/Login e estilos]
        depende_de: [T-07, T-08, T-09, T-10, T-35]
        criterios_de_conclusao:
          - Aceita e-mail válido ou CPF 444.333.222-11 com a senha SENHA123.
          - Digitar 44433322211 no campo de identificação mostra 444.333.222-11.
          - Credencial incorreta mostra apenas "Dados inválidos" e mantém a usuária no login.
          - Borda de erro desaparece ao editar o campo.
          - Olho alterna entre mostrar e ocultar a senha.
        tamanho: G

      - id: T-18
        titulo: Tela de Estoque
        descricao: >
          Montar a listagem com toolbar (pesquisa em ~80% e filtro em ~20%), pesquisa em tempo real
          por nome e código sem diferenciar maiúsculas, filtro por status, tabela com pill,
          stepper e botão de salvar por linha, contagem de itens e estado vazio. Salvar só fica
          disponível quando a linha tem alteração pendente.
        entradas: [imgs-prototipo 17-11-29, imgs-prototipo 17-11-34, imgs-prototipo 17-11-38, imgs-prototipo 17-11-46]
        entregaveis: [pages/Estoque e estilos]
        depende_de: [T-15, T-06]
        criterios_de_conclusao:
          - Pesquisa e filtro combinados produzem exatamente os recortes das capturas.
          - Contagem acompanha o resultado e mostra zero no estado vazio.
          - Quantidade nunca fica negativa e o salvamento é individual.
          - Botão de salvar evidencia a linha com alteração pendente.
        tamanho: G

      - id: T-19
        titulo: Modal de detalhes da peça
        descricao: >
          Implementar o modal aberto pelo nome da peça, exibindo nome, descrição, código,
          quantidade atual (incluindo ajuste pendente), status e a ação de editar, que navega para
          a tela de edição com a peça selecionada. Sem captura de referência: derivar do card e do
          padrão de modal.
        entradas: [specs/specs.yml (RF-05), lacunas_do_prototipo]
        entregaveis: [components/DetalhesPecaModal]
        depende_de: [T-11, T-18]
        criterios_de_conclusao:
          - Quantidade mostrada reflete o ajuste pendente da tabela.
          - Ação de editar leva à peça correta.
        tamanho: M

      - id: T-20
        titulo: Tela de Cadastro de peça
        descricao: >
          Formulário em card com área de imagem tracejada, campos em duas colunas, descrição em
          textarea, valor e limite lado a lado, quantidade com stepper e ações no rodapé. Valor
          opcional com até duas casas e separador ponto ou vírgula; limite inteiro; quantidade
          inteira positiva; validação com borda vermelha e toast de erro; sucesso com toast.
        entradas: [imgs-prototipo 17-11-49, imgs-prototipo 17-11-52, imgs-prototipo 17-14-02]
        entregaveis: [pages/CadastrarPeca e estilos]
        depende_de: [T-08, T-09, T-13, T-06]
        criterios_de_conclusao:
          - Campo obrigatório vazio bloqueia o envio com "todos campos devem ser preenchidos".
          - Cadastro válido insere a peça e mostra "peça cadastrada com sucesso".
          - Valor aceita "120,2" e "120.20"; limite e quantidade recusam não inteiros.
        tamanho: G

      - id: T-21
        titulo: Tela de Edição de peça
        descricao: >
          Formulário com seletor "Escolha a peça que deseja editar" iniciando em "Selecione",
          carregamento automático dos sete campos, área de imagem que acompanha a peça escolhida,
          validação de todos os campos e ações "Cancelar" e "Salvar alterações".
        entradas: [imgs-prototipo 17-14-21, imgs-prototipo 17-14-24, imgs-prototipo 17-14-34, imgs-prototipo 17-14-39]
        entregaveis: [pages/EditarPeca e estilos]
        depende_de: [T-08, T-09, T-13, T-06]
        criterios_de_conclusao:
          - Nenhum campo é salvo sem peça selecionada.
          - Seleção carrega os dados corretos e atualiza a identificação da imagem.
          - Erro mostra borda vermelha e "Todos campos devem ser preenchidos".
          - Sucesso mostra "Peça atualizada com sucesso!" e propaga a alteração ao estoque.
        tamanho: G

      - id: T-22
        titulo: Tela de Dashboard
        descricao: >
          Três cards de KPI (produtos vendidos com variação, categoria mais vendida com
          participação, peça sem saída no mês), gráfico de barras dos últimos seis meses com
          seletor "Mensal" e donut de distribuição por categoria com total central e legenda.
          Filtro de período com 30 e 15 dias.
        entradas: [imgs-prototipo 17-14-44]
        entregaveis: [pages/Dashboard, componentes de gráfico SVG e estilos]
        depende_de: [T-14, T-06]
        criterios_de_conclusao:
          - Composição dos cards e proporções dos gráficos idênticas à captura.
          - Números, percentuais e cores de gráfico conferem (46% / 31% / 23%).
          - Alternar o período atualiza os indicadores exibidos.
        tamanho: G

      - id: T-23
        titulo: Cobranças — abas e cobranças registradas
        descricao: >
          Implementar a tela com trilho de abas "Cobranças registradas" e "Cadastrar cobrança",
          abrindo sempre na primeira e destacando a aba ativa em azul. Montar o painel com título,
          subtítulo e badge de contagem e a lista de cartões: faixa colorida à esquerda, pill de
          situação no topo direito, nome do comprador, documento e telefone formatados, peças com
          quantidade, forma de venda e vencimento em duas colunas, progresso de parcelas e área de
          ações.
        entradas: [imgs-prototipo 19-48-50, imgs-prototipo 19-48-57, cores_cobrancas]
        entregaveis: [pages/Cobrancas, ListaCobrancas, CobrancaCard, ProgressBar, Badge e estilos]
        depende_de: [T-12, T-14, T-06]
        criterios_de_conclusao:
          - Aba inicial é sempre cobranças registradas.
          - Cartões em aberto, vencendo, vencidos e pagos usam exatamente as cores de cores_cobrancas.
          - Cartão pago exibe progresso completo e o rodapé de histórico, sem ações.
          - Documento e telefone aparecem com máscara, como nas capturas.
        tamanho: GG

      - id: T-24
        titulo: Baixas de cobrança e modal de confirmação
        descricao: >
          Ações de baixar parcela e baixa total conforme a situação do cartão: "Baixar parcela"
          apenas em cobranças parceladas em aberto, "Baixa total" em qualquer cobrança em aberto e
          nenhuma ação em cobrança paga. Modal de confirmação com nome do cliente, explicação de que
          o registro permanece no histórico, "Cancelar" e "Confirmar baixa total".
        entradas: [specs/specs.yml (RF-11), imgs-prototipo 19-48-50, imgs-prototipo 19-48-57]
        entregaveis: [baixas no DadosContext, ConfirmacaoBaixaTotal]
        depende_de: [T-23, T-11]
        criterios_de_conclusao:
          - Parcela avança uma unidade sem ultrapassar o total.
          - Cobrança de 1x mostra apenas "Baixa total".
          - Cancelar não altera a cobrança; confirmar marca como paga e move o cartão para o estado pago.
        tamanho: M

      - id: T-25
        titulo: Sair e encerramento de sessão
        descricao: >
          Ligar a ação "Sair" do rodapé da sidebar ao encerramento de sessão, com retorno ao login
          e bloqueio das rotas internas.
        entradas: [specs/specs.yml (RF-01), imgs-prototipo 17-11-29]
        entregaveis: [integração em AuthContext e Sidebar]
        depende_de: [T-07, T-05]
        criterios_de_conclusao:
          - Sair leva ao login e uma rota interna digitada na URL volta ao login.
        tamanho: P

      - id: T-37
        titulo: Cobranças — formulário de cadastro
        descricao: >
          Implementar o card "Nova cobrança" com ícone, título e subtítulo, dividido em três seções.
          Dados do cliente: nome do comprador, CPF ou CNPJ e telefone com máscara. Peças da venda:
          seletor de peça com a disponibilidade no rótulo, campo de quantidade, botão "Adicionar" e
          lista das peças incluídas, com remoção e soma de repetidas. Condições de pagamento: forma
          de venda, parcelas de 1 a 12 e data limite. Botão "Cadastrar cobrança" em largura total.
          Todos os campos são obrigatórios; ao enviar, validar campo a campo e aplicar a regra de
          DA-10 e DA-11.
        entradas: [imgs-prototipo 19-49-03, imgs-prototipo 19-49-11, specs/specs.yml (RF-08, RF-09), T-35, T-36]
        entregaveis: [FormCobranca, ItensCobranca, DateField e estilos]
        depende_de: [T-08, T-09, T-10, T-23, T-35, T-36]
        criterios_de_conclusao:
          - Campo vazio deixa a borda vermelha e mostra o pop-up de campo não preenchido.
          - Valor fora do padrão (documento inválido, telefone incompleto, data inválida) deixa a borda vermelha e mostra o pop-up de preenchimento incorreto.
          - Quantidade acima do estoque disponível é recusada com a disponibilidade informada.
          - Cadastro válido mostra "Cobrança cadastrada com sucesso" e volta para a aba de registros.
          - A máscara é aplicada na digitação e o valor entregue à camada de dados está formatado.
        tamanho: GG

  - id: F3
    nome: Regras, validação e formatação
    objetivo: Concentrar as regras de negócio em funções puras testáveis.
    tarefas:

      - id: T-26
        titulo: Módulo de validação
        descricao: >
          Implementar validadores de e-mail, CPF, CNPJ, telefone, inteiro positivo, decimal com até
          duas casas (ponto ou vírgula), data de vencimento e campos obrigatórios, com mensagens
          centralizadas iguais às da especificação. Cada validador devolve um resultado explícito de
          vazio versus inválido, para que o formulário escolha entre a mensagem de campo não
          preenchido e a de preenchimento incorreto.
        entradas: [specs/specs.yml (seção 5), mensagens_padronizadas]
        entregaveis: [utils/validacao.js]
        depende_de: [T-02]
        criterios_de_conclusao:
          - Todas as mensagens exibidas vêm deste módulo, sem texto duplicado em componentes.
          - Validador distingue campo vazio, valor inválido e valor válido.
        tamanho: M

      - id: T-27
        titulo: Derivação de status
        descricao: >
          Criar funções que derivam o status da peça a partir de quantidade e limite de estoque e o
          status da cobrança a partir do vencimento e das parcelas pagas, incluindo a regra de sete
          dias contando o dia atual.
        entradas: [specs/specs.yml (RF-03, RF-10)]
        entregaveis: [utils/status.js]
        depende_de: [T-26]
        criterios_de_conclusao:
          - Mesma entrada sempre produz o mesmo status, inclusive na virada do dia.
        tamanho: M

      - id: T-28
        titulo: Formatação de valores
        descricao: >
          Criar formatadores de moeda brasileira, data, CPF/CNPJ, telefone e percentual, usados em
          tabelas, cards e resumos.
        entradas: [specs/specs.yml (restricoes.tecnicas)]
        entregaveis: [utils/formatacao.js]
        depende_de: [T-02]
        criterios_de_conclusao:
          - Valores exibidos como "129,90", datas como dd/mm/aaaa e percentuais como "46%".
        tamanho: P

      - id: T-35
        titulo: Máscaras de CPF, CNPJ e telefone
        descricao: >
          Criar utils/mascaras.js com funções de formatação durante a digitação e de produção do
          valor canônico entregue à camada de dados. CPF: aceita 55544433322 e devolve
          555.444.333-22. CNPJ: aceita 11222333000144 e devolve 11.222.333/0001-44. Telefone:
          aceita 11949350204 e devolve (11)-94935-0142; aceita também fixo de 10 dígitos. O campo
          "E-mail ou CPF" do login aplica a máscara de CPF quando a entrada contém apenas dígitos e
          preserva o texto quando há arroba. O campo de telefone do cadastro de cobrança aplica a
          máscara de telefone. Máscaras nunca bloqueiam a digitação: apenas formatam e truncam
          excedentes.
        entradas: [DA-09, imgs-prototipo 19-48-50, imgs-prototipo 17-04-34]
        entregaveis:
          - utils/mascaras.js com formatarCpf, formatarCnpj, formatarDocumento, formatarTelefone e apenasDigitos.
          - Componentes de campo aceitando máscara por prop.
        depende_de: [T-26]
        criterios_de_conclusao:
          - Digitar 55544433322 em qualquer campo de documento resulta em 555.444.333-22.
          - Digitar 11949350204 no telefone resulta em (11)-94935-0142.
          - O login aceita e-mail com arroba sem aplicar máscara numérica.
          - O valor recebido pela camada de dados já está formatado.
        tamanho: M

      - id: T-36
        titulo: Validação do cadastro de cobrança
        descricao: >
          Definir e implementar as regras de cada campo do cadastro de cobrança, todas
          obrigatórias: nome do comprador com ao menos três caracteres; CPF com 11 dígitos válidos
          ou CNPJ com 14 dígitos válidos; telefone com DDD e 10 ou 11 dígitos; ao menos uma peça
          adicionada, com quantidade inteira positiva dentro do estoque disponível; forma de venda
          entre cartão, dinheiro e pix; parcelas entre 1 e 12; data limite válida e não anterior ao
          dia atual. Produzir a lista de campos com erro e o tipo de erro de cada um para a tela
          aplicar borda vermelha e escolher o pop-up.
        entradas: [DA-10, DA-11, specs/specs.yml (RF-08, RF-09), mensagens_padronizadas]
        entregaveis: [utils/validacaoCobranca.js]
        depende_de: [T-26, T-35]
        criterios_de_conclusao:
          - Cada campo obrigatório ausente é apontado individualmente.
          - Cada campo preenchido de forma inválida é apontado individualmente.
          - Regras usam os valores já mascarados e as quantidades salvas no estoque.
        tamanho: M

  - id: F4
    nome: Responsividade
    objetivo: Atender ao comportamento abaixo de 800 px descrito na especificação.
    tarefas:

      - id: T-29
        titulo: Adaptar o shell e as telas para telas pequenas
        descricao: >
          Abaixo de 800 px substituir a sidebar fixa por menu sobreposto com botão de abertura,
          empilhar toolbar, formulários, abas, cards, KPIs e gráficos, ocultar colunas secundárias
          da tabela mantendo a identificação da peça e ajustar pop-ups com margens laterais.
        entradas: [specs/specs.yml (RNF responsividade), imgs-prototipo]
        entregaveis: [media queries por componente e ajustes no shell]
        depende_de: [T-18, T-20, T-21, T-22, T-23, T-37]
        criterios_de_conclusao:
          - Nenhuma rolagem horizontal indesejada em 375 px e 768 px.
          - Menu abre, navega e fecha pelo teclado.
        tamanho: G

      - id: T-30
        titulo: Ajustes finos de mobile
        descricao: >
          Revisar alturas de toque, tamanho de toast, botão de ajuda flutuante, paginação e
          espaçamentos em telas pequenas.
        entradas: [T-29]
        entregaveis: [ajustes de CSS]
        depende_de: [T-29]
        criterios_de_conclusao:
          - Todos os controles acionáveis com alvo de toque confortável.
        tamanho: P

  - id: F5
    nome: Acessibilidade
    objetivo: Cumprir os requisitos não funcionais de acessibilidade.
    tarefas:

      - id: T-31
        titulo: Revisão de acessibilidade
        descricao: >
          Garantir navegação completa por teclado, foco visível, rótulos associados, nomes
          acessíveis em botões de ícone, contraste adequado, mensagens de erro em texto e foco
          contido em modais e toasts.
        entradas: [specs/specs.yml (requisitos_nao_funcionais.acessibilidade)]
        entregaveis: [ajustes de markup e CSS, checklist preenchido]
        depende_de: [T-17, T-18, T-20, T-21, T-23, T-24, T-37]
        criterios_de_conclusao:
          - Percorrer todas as telas apenas com Tab e Enter.
          - Nenhum ícone acionável sem nome acessível.
        tamanho: M

  - id: F6
    nome: Conferência visual e aceite
    objetivo: Provar que o CSS está igual às imagens e o comportamento igual à especificação.
    tarefas:

      - id: T-32
        titulo: Comparação lado a lado com as capturas
        descricao: >
          Capturar cada tela implementada na mesma largura das imagens e comparar com as 23
          referências: posição de blocos, cores, tipografia, espaçamentos, raios, pills, toasts e
          estados. Incluir os cartões de cobrança nas quatro situações e o formulário de cadastro
          vazio e em erro. Registrar divergências e corrigir.
        entradas: [imgs-prototipo/, mapa_das_imagens]
        entregaveis: [relatório de conferência por tela]
        depende_de: [T-17, T-18, T-20, T-21, T-22, T-23, T-37]
        criterios_de_conclusao:
          - Cada captura tem correspondente implementado e aprovado.
          - Divergências residuais registradas com justificativa.
        tamanho: G

      - id: T-33
        titulo: Ajuste fino de CSS
        descricao: >
          Corrigir diferenças de espaçamento, peso de fonte, altura de linha, sombra e alinhamento
          apontadas na conferência.
        entradas: [T-32]
        entregaveis: [correções de CSS]
        depende_de: [T-32]
        criterios_de_conclusao:
          - Nenhuma divergência aberta sem justificativa.
        tamanho: M

      - id: T-34
        titulo: Fechamento técnico
        descricao: >
          Garantir npm run lint e npm run build limpos, remover assets não usados da demo,
          atualizar o README com como rodar e com o mapa de telas, e revisar os critérios de aceite
          da especificação um a um.
        entradas: [specs/specs.yml (seção 5)]
        entregaveis:
          - Build e lint limpos.
          - README atualizado.
          - Checklist de CA-01 a CA-23 preenchido.
        depende_de: [T-33]
        criterios_de_conclusao:
          - Todos os critérios de aceite verificados e marcados.
          - Nenhum arquivo da demo do Vite permanece no projeto.
        tamanho: M

checklist_visual_por_tela:
  Login:
    - Painel esquerdo com gradiente, brilho radial e marca na parte superior.
    - Sobretítulo azul em caixa alta, título e subtítulo com hierarquia correta.
    - Campos com 52 px de altura e raio 10 px.
    - Toast no topo à direita sobre o cabeçalho.
    - Botão Entrar em largura total.
    - Botão de ajuda flutuante no canto inferior direito.
  Estoque:
    - Sidebar com 252 px, item ativo azul e rodapé com Sair e versão.
    - Toolbar com pesquisa em 80% e filtro em 20% da largura.
    - Cabeçalho da tabela em caixa alta cinza e colunas alinhadas.
    - Pills com cores por status e texto legível.
    - Stepper e botão de salvar em cada linha.
    - Rodapé com contagem e paginação.
  Cadastrar peça:
    - Área de imagem tracejada com ícone circular e textos auxiliares.
    - Campos em duas colunas, descrição em textarea com altura fixa.
    - Stepper de quantidade abaixo do limite de estoque.
    - Rodapé com Cancelar e ação principal alinhados à direita.
  Editar peça:
    - Seletor de peça com fundo azul suave antes dos demais campos.
    - Área de imagem com nome da peça e texto "Clique para substituir".
    - Ações Cancelar e Salvar alterações no rodapé do card.
  Dashboard:
    - Três KPIs em uma linha com ícones suaves.
    - Gráfico de barras com eixo de meses e seletor Mensal.
    - Donut com total central e legenda com percentuais.
  Cobranças:
    - Trilho de abas com a aba ativa azul preenchida e ícone.
    - Painel com título, subtítulo e badge "3 registros" em azul suave.
    - Cartão com faixa de 4 px à esquerda na cor da situação e fundo tonalizado.
    - Pill no canto superior direito com o texto da situação.
    - Bloco de peças com quantidade em destaque seguida do nome.
    - Forma de venda e vencimento em duas colunas com rótulos pequenos.
    - Barra de progresso com contagem "N de N" à direita.
    - Ações alinhadas à direita, com "Baixa total" como ação primária.
    - Cartão pago com rodapé de histórico e sem ações.
  Cadastrar cobrança:
    - Aba "Cadastrar cobrança" ativa ao abrir o formulário.
    - Card estreito e centralizado com ícone, título e subtítulo.
    - Três seções separadas por espaçamento, com rótulos em negrito.
    - CPF ou CNPJ e telefone lado a lado, com máscara visível na digitação.
    - Peça, quantidade e botão "Adicionar" na mesma linha.
    - Forma de venda e parcelas lado a lado; data limite em largura total.
    - Botão "Cadastrar cobrança" em largura total, com ícone de seta.
    - Campos inválidos em vermelho e um único toast por tentativa.

mensagens_padronizadas:
  fonte: Transcritas de specs/specs.yml (seção 5) e complementadas pelas regras desta versão.
  login_invalido: "Dados inválidos"
  estoque_sem_resultado: "Nenhuma peça encontrada."
  peca_cadastro_campos_vazios: "todos campos devem ser preenchidos"
  peca_cadastro_sucesso: "peça cadastrada com sucesso"
  peca_edicao_campos_vazios: "Todos campos devem ser preenchidos"
  peca_edicao_sucesso: "Peça atualizada com sucesso!"
  cobranca_campo_vazio: "Preencha todos os dados da cobrança."
  cobranca_campo_invalido: "Preencha os campos destacados corretamente."
  cobranca_sucesso: "Cobrança cadastrada com sucesso"
  regra: >
    Cada tentativa de envio exibe no máximo um pop-up, com o tempo de exibição e o botão de
    fechar do componente Toast. A borda vermelha acompanha a mensagem sempre que houver campo com
    problema e desaparece quando o campo é corrigido.
  textos_de_apoio:
    - "Pagamento concluído · mantido no histórico (rodapé do cartão pago)"
    - "Vence em N dias, Vencida e Pago (pills de situação do cartão)"
    - "Mostrando N de M peças (rodapé da tabela de estoque)"

riscos:
  - risco: Recorte do logo com fundo verde pode deixar halo nas bordas.
    mitigacao: Trabalhar com máscara de cor e conferir sobre fundo claro e escuro antes de fechar os ativos.
  - risco: Ausência de capturas do modal de detalhes, do modal de baixa total e do mobile gerar inconsistência visual.
    mitigacao: Derivar dessas telas apenas componentes já existentes e validar no aceite com a especificação.
  - risco: Máscara aplicada no próprio input impedir a digitação de dados válidos.
    mitigacao: Formatar por acréscimo de dígitos, nunca reescrever a posição do cursor, e testar apagando caracteres no meio do valor.
  - risco: Documento mascarado ser validado como texto e reprovar CPF correto.
    mitigacao: Validar sobre os dígitos e formatar apenas o valor final, na ordem prevista em DA-09.
  - risco: Fonte Inter não incluída no projeto causar diferença de métrica.
    mitigacao: Empacotar a fonte localmente e comparar larguras de texto com as capturas.
  - risco: Medidas aferidas por proporção divergirem em alguns pixels.
    mitigacao: Conferência visual da T-32 com correção na T-33.
  - risco: Aumento de escopo ao implementar elementos visuais sem comportamento definido.
    mitigacao: Manter comportamento neutro conforme DA-07.

definicao_de_pronto:
  - npm run dev e npm run build funcionam sem erro.
  - npm run lint sem erros.
  - Telas e estados mapeados em mapa_das_imagens implementados e conferidos.
  - Todos os critérios de aceite de specs/specs.yml verificados.
  - Máscaras de CPF, CNPJ e telefone aplicadas no login e no cadastro de cobrança, com valor canônico formatado na camada de dados.
  - Cadastro de cobrança bloqueia envio com campo vazio ou inválido, marcando bordas e exibindo um único pop-up.
  - Nenhuma dependência de backend, API ou banco de dados.
  - Navegação completa por teclado e layout operável abaixo de 800 px.
