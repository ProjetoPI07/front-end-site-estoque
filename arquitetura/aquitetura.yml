projeto: Constru Móveis — Gestão de Estoque (front-end)
documento: Arquitetura e plano de tarefas
versao: "1.1"
data: "2026-11-20"
pasta: arquitetura/

historico_de_versoes:
  - versao: "1.0"
    mudanca: Primeira versão, com 19 capturas e 34 tarefas.
  - versao: "1.1"
    mudanca: >
      Incorporadas as 4 capturas da área de Cobranças (lista registrada e cadastro), removidas as
      lacunas correspondentes, adicionadas as regras de validação de cobrança com borda vermelha e
      pop-up, e incluídas as máscaras de CPF/CNPJ e telefone no login e no cadastro de cobrança.
      Total de 23 capturas e 37 tarefas.

referencias:
  comportamento: specs/specs.yml
  comportamento_legivel: specs/especificacao.md
  documento_base: md_ConstruMoveis_atualizado.md
  prototipo_visual: imgs-prototipo/
  marca: logos-do-site/
  implementacao_atual: scaffold Vite + React (src/App.jsx ainda é a demo do Vite)

resumo_executivo: >
  O front-end deve ser reescrito do zero sobre o scaffold já instalado (Vite 8 + React 19 +
  JavaScript/JSX), substituindo a demo atual. A fonte de verdade visual são as 23 capturas de
  tela em imgs-prototipo/, que fixam layout, cores, espaçamentos e estados, incluindo a área de
  Cobranças (histórico de registros e formulário de cadastro). A fonte de verdade de
  comportamento é specs/specs.yml, que cobre Login, Estoque, Cadastro, Edição, Cobranças e
  Dashboard. Ainda faltam capturas do modal de detalhes da peça, do modal de confirmação de baixa
  total, do estado responsivo e do logout, que precisam ser derivadas do mesmo sistema visual. O
  CSS deve ser escrito à mão, com tokens extraídos das imagens, sem framework de UI. Todas as
  entradas de usuário do cadastro de cobrança são obrigatórias e validadas com borda vermelha e
  pop-up, e os campos de documento e telefone aplicam máscara antes de chegar à camada de dados.

escopo_tecnico:
  linguagem: JavaScript (JSX), sem TypeScript
  biblioteca: React 19
  build: Vite 8
  estilos: CSS próprio por componente + variáveis CSS globais (sem Tailwind, sem Bootstrap)
  estado: React local + Context para dados de sessão, sem gerenciador externo
  dados: em memória, sem backend, sem API, sem persistência (ver restricoes em specs/specs.yml)
  normalizacao_de_entrada: >
    A camada de dados recebe valores já formatados (CPF, CNPJ e telefone com máscara). Não há
    backend nesta entrega; quando houver, o payload sai exatamente como está armazenado.
  graficos: SVG escrito à mão (barras e donut), sem biblioteca de gráficos
  icones: SVG inline/sprite próprio (sem biblioteca de ícones)

decisoes_de_arquitetura:

  - id: DA-01
    tema: Fidelidade visual
    decisao: >
      O CSS é derivado das capturas, não de um tema genérico. Todos os valores de cor, tamanho,
      espaçamento, raio e sombra vivem em um único arquivo de tokens, e nenhum componente usa
      valores soltos.
    motivo: O requisito é CSS igual ao das imagens; tokens únicos evitam divergência entre telas.

  - id: DA-02
    tema: Base tipográfica
    decisao: >
      Fonte Inter incluída no projeto (arquivos locais em public/fonts) e base de 19 px nas telas
      internas. A sidebar mantém escala própria: navegação em 18 px e marca em 20 px.
    motivo: A base de 19 px consta no documento base e é consistente com a escala de 1583 px das capturas.

  - id: DA-03
    tema: Organização do CSS
    decisao: >
      Um arquivo tokens.css com variáveis na raiz, um base.css para reset/tipografia e um arquivo
      .css por componente/página, importado pela página que o usa.
    motivo: Isola a responsabilidade de cada bloco visual e facilita a conferência com as imagens.

  - id: DA-04
    tema: Navegação
    decisao: >
      Rotas reais com react-router-dom e guarda de sessão em Context. A rota raiz redireciona para
      /login quando não há sessão.
    motivo: O protótipo tem breadcrumb, itens de sidebar e URLs distintas por tela.

  - id: DA-05
    tema: Dados
    decisao: >
      Um módulo de dados em memória (seed) com peças, categorias e cobranças, exposto por um
      Context com as ações de cadastrar, editar, ajustar quantidade e dar baixa.
    motivo: Atender ao comportamento especificado sem backend, mantendo uma única fonte de verdade
      para estoque e cobranças.

  - id: DA-06
    tema: Marca
    decisao: >
      Os dois arquivos de logos-do-site são telas do manual de identidade sobre fundo verde sólido
      (#47704C), sem transparência. É preciso recortar o fundo e gerar os ativos definitivos antes
      de usar no layout.
    motivo: Sem o recorte, o logo não pode ser aplicado na sidebar escura nem no painel de login.

  - id: DA-07
    tema: Elementos da imagem sem comportamento especificado
    decisao: >
      Sino de notificações, "Lembrar de mim", "Esqueci minha senha", paginação e botão flutuante
      de ajuda são implementados com o visual do protótipo e comportamento neutro/informativo,
      sem inventar regra de negócio.
    motivo: Preservar a fidelidade visual sem criar funcionalidade fora do escopo aprovado.

  - id: DA-08
    tema: Onde a especificação diverge da imagem
    decisao: >
      Em conflito, vale o comportamento descrito em specs/specs.yml e o visual descrito nas
      imagens. Exemplo: a captura de erro do cadastro de cobrança mostra apenas o pop-up, sem
      borda vermelha; vale a regra mais recente, com borda vermelha em todos os campos inválidos.
    motivo: A especificação define o produto; as imagens definem a aparência.

  - id: DA-09
    tema: Máscaras de entrada e valor enviado
    decisao: >
      Os campos de documento e telefone aceitam apenas dígitos e aplicam máscara durante a
      digitação. O valor canônico, que a camada de dados recebe (e que futuramente iria ao
      backend), é sempre formatado: CPF como 555.444.333-22, CNPJ como 11.222.333/0001-44 e
      telefone como (11)-94935-0142. Nenhum componente monta máscara por conta própria; todos
      usam utils/mascaras.js.
    motivo: A digitação deve ser livre e o dado que sai do formulário deve ser normalizado uma única vez.

  - id: DA-10
    tema: Validação de cobrança
    decisao: >
      No cadastro de cobrança, todos os campos de entrada são obrigatórios e validados antes do
      envio. Campo vazio ou fora do padrão recebe borda vermelha e halo suave, o primeiro campo
      inválido recebe foco e um pop-up informa o que fazer. O comportamento é o mesmo já usado em
      Login, Cadastro e Edição de peça.
    motivo: Padronizar o feedback de erro em toda a aplicação.

  - id: DA-11
    tema: Um pop-up por tentativa de envio
    decisao: >
      Cada tentativa de envio gera no máximo um pop-up: mensagem de campo não preenchido quando
      houver campo vazio, mensagem de preenchimento incorreto quando todos estiverem preenchidos
      mas algum valor for inválido, e mensagem de sucesso quando tudo estiver válido. Os campos
      com problema ficam marcados em vermelho nas duas primeiras situações.
    motivo: Evitar empilhamento de mensagens e manter o padrão dos demais formulários.

bibliotecas:
  ja_instaladas:
    - react
    - react-dom
    - vite
    - "@vitejs/plugin-react"
  a_adicionar:
    - nome: react-router-dom
      motivo: Rotas do protótipo e guarda de autenticação (DA-04)
  proibidas:
    - bibliotecas de UI prontas (alteram o CSS e quebram a fidelidade visual)
    - bibliotecas de gráficos (o protótipo usa barras e donut simples, viáveis em SVG)
    - bibliotecas de ícones (os ícones do protótipo são traços finos específicos)

