sistema: Constru Móveis — Gestão de Estoque
versao: "1.0"
fonte: md_ConstruMoveis_atualizado.md
escopo: protótipo navegável de gestão de estoque, com dados mantidos apenas durante a sessão
natureza: especificação de comportamento esperado, sem detalhes de implementação

# ---------------------------------------------------------------------------
# 1. Objetivos
# ---------------------------------------------------------------------------
objetivos:
  problema: >
    A gestão de estoque de peças e o controle de cobranças de uma loja de móveis
    são feitos de forma dispersa. Não existe um lugar único para consultar a
    quantidade disponível de cada peça, identificar itens em nível baixo ou
    crítico, manter o cadastro das peças atualizado e acompanhar o que foi
    vendido e o que ainda está em aberto. Como consequência, o responsável
    descobre a falta de uma peça tarde, perde tempo conferindo informações em
    fontes diferentes e não tem visão do andamento dos pagamentos.

  resultado_esperado:
    - Usuária autenticada acessa todas as áreas do sistema a partir de um único login.
    - Estoque consultável por nome ou código, com filtro por situação e ajuste de quantidade por item.
    - Peças cadastradas e editadas com validação de dados antes de qualquer registro.
    - Cobranças registradas com controle de parcelas, vencimento e situação de pagamento.
    - Indicadores de vendas e de distribuição do estoque reunidos em um dashboard.
    - Toda a experiência utilizável em desktop e em telas pequenas.

  publico_alvo:
    - Perfil administrativo responsável pelo estoque e pelas cobranças.

# ---------------------------------------------------------------------------
# 2. Requisitos funcionais
# ---------------------------------------------------------------------------
requisitos_funcionais:

  - id: RF-01
    nome: Autenticação
    descricao: >
      O sistema solicita identificação por e-mail ou CPF e senha antes de liberar
      as áreas internas. Credenciais válidas levam à tela de Estoque.
    regras:
      - Aceita qualquer e-mail em formato válido ou o CPF cadastrado no protótipo.
      - O campo de identificação aceita e-mail ou CPF e aplica máscara de CPF quando a entrada contém apenas dígitos, preservando o texto quando há arroba.
      - A senha diferencia maiúsculas de minúsculas.
      - Credencial incorreta ou campo vazio produzem um único aviso genérico, sem indicar qual campo falhou.
      - Os dois campos recebem marcação visual de erro no mesmo momento.
      - A marcação de erro desaparece do campo assim que ele é editado novamente.
      - A senha pode ser exibida e ocultada durante a digitação.
      - A ação de sair encerra a sessão e retorna à tela de login.

  - id: RF-02
    nome: Consulta de estoque
    descricao: >
      A tela de estoque lista as peças com identificação, código, situação e
      quantidade, permitindo localizar itens por texto e por situação.
    regras:
      - A pesquisa acompanha a digitação e considera nome e código da peça.
      - A pesquisa ignora diferenças entre maiúsculas e minúsculas.
      - A pesquisa e o filtro por situação podem ser usados ao mesmo tempo.
      - Sem resultados, a lista informa que nenhuma peça foi encontrada.
      - A contagem de itens visíveis acompanha o resultado da pesquisa e do filtro.
      - Clicar no nome da peça abre a visualização de detalhes.

  - id: RF-03
    nome: Situação da peça
    descricao: >
      Cada peça é classificada automaticamente em uma situação que representa o
      quanto sua quantidade está distante do limite de estoque definido.
    regras:
      - Situações possíveis - em estoque, estoque baixo e crítico.
      - O filtro por situação aceita a opção de exibir todos os status.
      - A situação é recalculada a partir da quantidade e do limite de estoque vigentes.

  - id: RF-04
    nome: Ajuste rápido de quantidade
    descricao: >
      A quantidade de cada peça pode ser aumentada ou reduzida diretamente na
      lista, com confirmação individual do ajuste.
    regras:
      - O controle de ajuste permite aumentar e diminuir a quantidade em uma unidade por acionamento.
      - A quantidade nunca fica abaixo de zero.
      - O ajuste de uma peça não afeta as demais.
      - A confirmação fica indisponível enquanto não houver alteração pendente e é evidenciada quando houver.
      - Confirmar o ajuste faz da nova quantidade a referência atual da peça.
      - Ajustes não confirmados não alteram a referência da peça.

  - id: RF-05
    nome: Detalhes da peça
    descricao: >
      Uma visualização de detalhes apresenta os dados da peça e oferece atalho
      para editá-la.
    regras:
      - Exibe nome, descrição, código, quantidade atual, situação e a ação de editar.
      - A quantidade exibida considera o ajuste pendente na lista, mesmo antes de confirmado.
      - O atalho de edição leva à tela de edição com a peça correspondente.

  - id: RF-06
    nome: Cadastro de peça
    descricao: >
      O formulário de cadastro registra uma nova peça a partir dos dados
      informados, validando-os antes de concluir.
    regras:
      - Solicita nome, código, categoria, descrição, valor, limite de estoque e quantidade em estoque.
      - Categoria é escolhida entre as categorias disponíveis no sistema.
      - Valor é opcional no cadastro e aceita até duas casas decimais, com ponto ou vírgula.
      - Limite de estoque aceita apenas números inteiros.
      - Quantidade em estoque aceita apenas inteiros positivos, por digitação ou pelos botões de incremento e decremento.
      - Campos numéricos recusam caracteres incompatíveis com a regra do campo.
      - Cadastro com campo obrigatório vazio é recusado, com marcação nos campos inválidos e aviso ao usuário.
      - Cadastro válido é confirmado ao usuário.

  - id: RF-07
    nome: Edição de peça
    descricao: >
      O formulário de edição carrega os dados de uma peça existente, permite
      alterá-los e salva as mudanças.
    regras:
      - O formulário inicia sem peça selecionada e a primeira opção de seleção é um convite explícito.
      - Selecionar uma peça preenche nome, código, categoria, descrição, valor, quantidade e limite de estoque.
      - A identificação visual acompanha a peça selecionada.
      - Todos os campos, incluindo a seleção da peça, são obrigatórios na edição.
      - Campos vazios são recusados, com marcação nos campos inválidos e aviso ao usuário.
      - Dados válidos são salvos e confirmados ao usuário.

  - id: RF-08
    nome: Cobranças - registro e cadastro
    descricao: >
      A área de cobranças oferece duas visões, uma de cobranças registradas e
      outra de cadastro de nova cobrança.
    regras:
      - A visão de cobranças registradas é sempre a primeira apresentada.
      - A nova cobrança exige nome do comprador, CPF ou CNPJ, telefone, ao menos uma peça, forma de venda, quantidade de parcelas e data limite de vencimento.
      - Nome do comprador deve ter ao menos três caracteres.
      - CPF ou CNPJ informado deve ser válido e é mascarado durante a digitação.
      - Telefone informado deve ter DDD e 10 ou 11 dígitos e é mascarado durante a digitação.
      - Data limite de vencimento deve ser válida, não pode ser anterior ao dia atual e é informada no formato dd/mm/aaaa.
      - As formas de venda possíveis são cartão, dinheiro e pix.
      - O parcelamento vai de 1 a 12 parcelas.
      - Todos os campos de entrada são obrigatórios, incluindo ao menos uma peça.
      - Campo não preenchido gera o aviso de preenchimento; campo com valor inválido gera o aviso de preenchimento incorreto.
      - Dado obrigatório ausente é recusado com aviso ao usuário.
      - Cadastro concluído é confirmado e leva de volta à visão de cobranças registradas.

  - id: RF-09
    nome: Cobranças - composição de peças
    descricao: >
      Cada cobrança é composta por uma ou mais peças do estoque, com quantidade
      informada pelo usuário.
    regras:
      - Cada opção de peça informa a quantidade disponível no estoque.
      - A quantidade informada deve ser um inteiro positivo.
      - É possível compor a cobrança com mais de uma peça.
      - Uma peça adicionada pode ser removida antes da conclusão do cadastro.
      - Adicionar novamente a mesma peça soma as quantidades em vez de criar uma segunda linha.
      - A soma selecionada nunca ultrapassa o estoque disponível.
      - Quantidade inválida é recusada com a indicação da disponibilidade atual.
      - A disponibilidade considerada é a quantidade salva na tela de estoque.

  - id: RF-10
    nome: Cobranças - situação e vencimento
    descricao: >
      Cada cobrança registrada é apresentada em um cartão que resume o cliente,
      os itens, a forma de venda, o vencimento e o andamento do pagamento.
    regras:
      - O cartão exibe nome do cliente, CPF ou CNPJ, telefone, peças e quantidades, forma de venda, vencimento, parcelas pagas e total, progresso e situação.
      - Situação sem vencimento próximo é apresentada na identificação padrão.
      - Vencimento em até sete dias, incluindo o dia atual, é sinalizado como próximo do vencimento.
      - Vencimento já ultrapassado é sinalizado como vencido.
      - Cobrança totalmente paga é sinalizada como concluída.
      - A situação é recalculada automaticamente enquanto a tela permanece aberta.

  - id: RF-11
    nome: Cobranças - baixas e histórico
    descricao: >
      O pagamento de uma cobrança pode ser registrado parcela a parcela ou em uma
      única baixa total, e o registro nunca é apagado.
    regras:
      - Cobranças parceladas oferecem baixa de uma parcela por vez.
      - Cada baixa avança o progresso em uma unidade, sem ultrapassar o total de parcelas.
      - Cobranças em aberto oferecem baixa total.
      - A baixa total exige confirmação em um modal que identifica o cliente e informa que o registro permanece no histórico.
      - O modal de confirmação pode ser cancelado sem efeito.
      - A cobrança só é considerada paga após a confirmação da baixa total.
      - Cobranças pagas permanecem visíveis como histórico.

  - id: RF-12
    nome: Dashboard
    descricao: >
      O dashboard reúne indicadores de vendas e de estoque, com filtro de período.
    regras:
      - O período pode ser de últimos 30 dias ou últimos 15 dias.
      - Exibe total de produtos vendidos com a variação do período.
      - Exibe a categoria de peça mais vendida com sua participação nas vendas.
      - Exibe a peça sem saída no mês com a indicação de zero saídas.
      - Exibe a movimentação de estoque dos últimos seis meses.
      - Exibe a distribuição atual do estoque por categoria.

  - id: RF-13
    nome: Navegação geral
    descricao: >
      A navegação principal reúne as áreas do sistema e indica a área em uso.
    regras:
      - A navegação oferece estoque, cadastro de peça, edição de peça, cobranças e dashboard.
      - A área em uso é destacada em relação às demais.
      - O cabeçalho identifica o sistema, a área atual e a usuária conectada.
      - A navegação está disponível em todas as telas internas e leva sempre à tela de login ao sair.

  - id: RF-14
    nome: Máscaras de entrada e normalização
    descricao: >
      Campos de documento e telefone aceitam apenas dígitos e aplicam máscara durante a
      digitação; o valor entregue à camada de dados é sempre o valor formatado.
    regras:
      - CPF é formatado como ###.###.###-##.
      - CNPJ é formatado como ##.###.###/####-##.
      - Telefone é formatado como (DD)-NNNNN-NNNN.
      - O campo "E-mail ou CPF" do login preserva o texto quando há arroba e aplica a máscara de CPF quando a entrada contém apenas dígitos.
      - A máscara não bloqueia a digitação nem reescreve a posição do cursor.
      - O valor normalizado é o mesmo que seria enviado a um backend.

# ---------------------------------------------------------------------------
# 3. Requisitos não funcionais
# ---------------------------------------------------------------------------
requisitos_nao_funcionais:

  acessibilidade:
    - Toda ação é operável apenas com teclado, com ordem de foco coerente com a leitura da tela.
    - Campos possuem rótulo associado; ícones que disparam ação possuem nome acessível.
    - Erros são comunicados por texto, e não somente por cor.
    - Texto e elementos interativos mantêm contraste legível sobre o fundo em que aparecem.
    - Modais e pop-ups recebem foco ao abrir, mantêm o foco contido enquanto abertos e devolvem o foco ao elemento de origem ao fechar.
    - Modais e pop-ups podem ser fechados pelo teclado.

  desempenho:
    - Pesquisa e filtro respondem durante a digitação, sem ação de confirmação.
    - O feedback de qualquer ação (salvar, cadastrar, dar baixa) é percebido como imediato.
    - A troca entre áreas e entre abas de cobranças não produz espera perceptível.

  compatibilidade:
    - Utilizável nas versões atuais dos navegadores de uso comum em desktop e em dispositivos móveis.
    - Comportamento consistente em resoluções de desktop e em telas pequenas.
    - A entrada de dados numéricos acompanha a forma de digitação local, aceitando ponto ou vírgula como separador decimal.

  usabilidade:
    - Interface em português do Brasil, com mensagens objetivas e mesmo texto para o mesmo evento em toda a aplicação.
    - Estrutura e vocabulário de telas consistentes entre áreas.
    - Mensagens de erro não expõem qual credencial falhou nem detalhes internos.
    - A identificação do estado atual (área, aba, filtro, seleção) é sempre visível.
    - Máscaras de entrada preservam a posição do cursor e não impedem a digitação.

  responsividade:
    - Abaixo de 800 px de largura, a navegação lateral fixa é substituída por um menu sobreposto.
    - Nessa mesma faixa, pesquisa e filtro ocupam toda a largura e ficam empilhados.
    - Nessa mesma faixa, a lista de peças oculta as colunas secundárias e mantém legível a identificação do item.
    - Nessa mesma faixa, formulários passam de duas para uma coluna.
    - Nessa mesma faixa, abas e cartões de cobrança são empilhados, assim como indicadores e gráficos.
    - Nessa mesma faixa, pop-ups e modais ocupam a largura disponível com margens laterais.

  identidade_visual:
    - Nome do sistema Constru Móveis, com a marca grafada em duas linhas na navegação lateral.
    - Paleta com azul primário para ações e destaques, azul escuro para navegação e títulos, fundo claro para conteúdo, superfície branca para cartões e campos, além de cores próprias para sucesso e erro.
    - Tipografia sem serifa com hierarquia proporcional entre títulos, textos de apoio, listas, formulários, cartões e modais.
    - Campos em estado padrão, com destaque de foco e marcação visual de erro.
    - Pop-ups de erro e de sucesso diferenciados visualmente, com mensagem e ação de fechar.
    - Ano 2026 na identificação de copyright.

# ---------------------------------------------------------------------------
# 4. Restrições
# ---------------------------------------------------------------------------
restricoes:

  escopo:
    - Entrega limitada a uma aplicação web responsiva, com prioridade para desktop.
    - Não há integração com backend, API, serviço externo ou banco de dados.
    - Não há múltiplos perfis de acesso nem gestão de usuários.
    - Não há emissão de nota, cálculo de imposto, controle fiscal ou envio de cobrança ao cliente.
    - Não há importação nem exportação de arquivos.
    - Não há cadastro de novas categorias além das disponíveis.

  dados:
    - Os dados existem apenas durante a sessão atual e são descartados ao recarregar a aplicação.
    - O conjunto inicial de peças, categorias e cobranças é fixo no protótipo.
    - O histórico de cobranças é mantido somente durante a sessão atual.
    - O ajuste de quantidade passa a valer como referência após a confirmação do salvamento.
    - A disponibilidade usada na composição de cobranças é a quantidade salva no estoque, não o ajuste pendente.

  tecnicas:
    - Aplicação executada no navegador, sem dependência de servidor de aplicação próprio.
    - Interface em português do Brasil com valores monetários e datas no formato local.
    - Layout precisa permanecer operável nas duas faixas de largura previstas.

# ---------------------------------------------------------------------------
# 5. Critérios de aceite
# ---------------------------------------------------------------------------
criterios_de_aceite:
  mensagens_padronizadas:
    - contexto: Falha de autenticação (credencial ou senha incorreta, campo vazio)
      mensagem: "Dados inválidos"
    - contexto: Pesquisa ou filtro de estoque sem resultado
      mensagem: "Nenhuma peça encontrada."
    - contexto: Cadastro de peça com campo obrigatório vazio
      mensagem: "todos campos devem ser preenchidos"
    - contexto: Cadastro de peça concluído
      mensagem: "peça cadastrada com sucesso"
    - contexto: Edição de peça com campo obrigatório vazio
      mensagem: "Todos campos devem ser preenchidos"
    - contexto: Edição de peça concluída
      mensagem: "Peça atualizada com sucesso!"
    - contexto: Cadastro de cobrança com campo obrigatório não preenchido
      mensagem: "Preencha todos os dados da cobrança."
    - contexto: Cadastro de cobrança com campo preenchido de forma inválida
      mensagem: "Preencha os campos destacados corretamente."
    - contexto: Cadastro de cobrança concluído
      mensagem: "Cobrança cadastrada com sucesso"

  itens:
    - id: CA-01
      criterio: Login é aceito com e-mail válido ou com o CPF do protótipo, sempre acompanhado da senha correta.
    - id: CA-02
      criterio: Falha de autenticação exibe apenas o aviso genérico e não revela qual credencial está incorreta.
    - id: CA-03
      criterio: A marcação de erro dos campos de login desaparece quando a credencial é editada.
    - id: CA-04
      criterio: Pesquisa por nome e pesquisa por código localizam a peça, sem distinção de maiúsculas e minúsculas.
    - id: CA-05
      criterio: Pesquisa e filtro por situação aplicados em conjunto retornam somente as peças que atendem aos dois critérios.
    - id: CA-06
      criterio: Sem correspondência, a lista informa que nenhuma peça foi encontrada.
    - id: CA-07
      criterio: A quantidade de estoque pode ser ajustada e salva individualmente, sem afetar outras peças e sem assumir valor negativo.
    - id: CA-08
      criterio: O salvamento de quantidade permanece indisponível enquanto não houver alteração pendente.
    - id: CA-09
      criterio: A visualização de detalhes apresenta os dados da peça com a quantidade vigente na lista e oferece a ação de editar.
    - id: CA-10
      criterio: Cadastro com campo obrigatório vazio é bloqueado, com marcação nos campos e aviso ao usuário.
    - id: CA-11
      criterio: Cadastro válido é concluído com confirmação ao usuário.
    - id: CA-12
      criterio: A edição exige a seleção da peça e o preenchimento de todos os campos antes de salvar.
    - id: CA-13
      criterio: A área de cobranças é acessível pela navegação e abre sempre na visão de cobranças registradas.
    - id: CA-14
      criterio: A composição de cobrança recusa quantidade superior ao estoque salvo e informa a disponibilidade.
    - id: CA-15
      criterio: A mesma peça adicionada duas vezes aparece somada e respeita o limite do estoque.
    - id: CA-16
      criterio: Cartões com vencimento em até sete dias são sinalizados como próximos do vencimento e cartões vencidos como vencidos.
    - id: CA-17
      criterio: A baixa de parcela avança o progresso em uma unidade e não ultrapassa o total de parcelas.
    - id: CA-18
      criterio: A baixa total só é aplicada após confirmação no modal, e o cancelamento não altera a cobrança.
    - id: CA-19
      criterio: Cobranças pagas continuam visíveis no histórico.
    - id: CA-20
      criterio: O dashboard alterna entre os períodos de 15 e 30 dias e apresenta os três indicadores e os dois gráficos previstos.
    - id: CA-21
      criterio: Pop-ups e avisos usam exatamente as mensagens definidas nesta especificação.
    - id: CA-22
      criterio: Todas as telas permanecem navegáveis e operáveis em desktop e em telas menores que 800 px.
    - id: CA-23
      criterio: Nenhuma operação depende de backend, API ou banco de dados.
    - id: CA-24
      criterio: CPF digitado sem pontuação é formatado como ###.###.###-## no login e no cadastro de cobrança.
    - id: CA-25
      criterio: Telefone digitado sem pontuação é formatado como (DD)-NNNNN-NNNN.
    - id: CA-26
      criterio: Cadastro de cobrança com valor inválido (CPF/CNPJ, telefone ou data) é bloqueado, com borda vermelha nos campos e pop-up de preenchimento incorreto.
    - id: CA-27
      criterio: Data limite de cobrança não pode ser anterior ao dia atual.

# ---------------------------------------------------------------------------
# 6. Cenários de comportamento
# ---------------------------------------------------------------------------
cenarios:

  - id: CN-01
    titulo: Login com credenciais válidas
    dado:
      - que estou na tela de login
    quando:
      - informo um e-mail em formato válido ou o CPF do protótipo
      - informo a senha correta
      - aciono a entrada
    entao:
      - sou levada à tela de estoque
      - o cabeçalho identifica a área atual e a usuária conectada

  - id: CN-02
    titulo: Login com credencial incorreta
    dado:
      - que estou na tela de login
    quando:
      - informo uma credencial ou uma senha incorreta
      - aciono a entrada
    entao:
      - os dois campos recebem marcação de erro
      - vejo apenas o aviso de dados inválidos
      - nenhuma indicação revela qual credencial falhou
      - permaneço na tela de login

  - id: CN-03
    titulo: Correção do erro de login
    dado:
      - que os campos de login estão marcados como inválidos
    quando:
      - edito qualquer um dos campos
    entao:
      - a marcação de erro do campo editado é removida

  - id: CN-04
    titulo: Exibição da senha
    dado:
      - que digitei uma senha no campo de senha
    quando:
      - aciono o controle de exibir senha
    entao:
      - o conteúdo digitado fica visível
    e_quando:
      - aciono novamente o controle
    e_entao:
      - o conteúdo volta a ser mascarado

  - id: CN-05
    titulo: Pesquisa de peça por nome ou código
    dado:
      - que estou na tela de estoque com peças listadas
    quando:
      - digito parte do nome ou do código de uma peça
    entao:
      - a lista passa a mostrar somente as peças correspondentes durante a digitação
      - a correspondência ignora maiúsculas e minúsculas
      - a contagem de itens acompanha o resultado

  - id: CN-06
    titulo: Pesquisa sem resultados
    dado:
      - que estou na tela de estoque
    quando:
      - digito um termo que não corresponde a nenhuma peça
    entao:
      - vejo a mensagem de que nenhuma peça foi encontrada
      - a contagem indica zero itens

  - id: CN-07
    titulo: Pesquisa combinada com filtro de situação
    dado:
      - que estou na tela de estoque
    quando:
      - seleciono uma situação no filtro
      - mantenho ou informo um termo de pesquisa
    entao:
      - vejo somente as peças que atendem à situação e ao termo ao mesmo tempo
      - a contagem acompanha o resultado combinado

  - id: CN-08
    titulo: Ajuste de quantidade com limite inferior
    dado:
      - que uma peça está com quantidade zero
    quando:
      - aciono a redução de quantidade
    entao:
      - a quantidade permanece em zero
    e_quando:
      - aciono o aumento de quantidade
    e_entao:
      - a quantidade aumenta em uma unidade

  - id: CN-09
    titulo: Salvamento de quantidade ajustada
    dado:
      - que alterei a quantidade de uma peça na lista
      - que ainda não confirmei o ajuste
    quando:
      - aciono a confirmação daquele item
    entao:
      - a nova quantidade passa a ser a referência atual da peça
      - a situação da peça é recalculada
      - a confirmação volta a ficar indisponível até um novo ajuste
      - as demais peças permanecem inalteradas

  - id: CN-10
    titulo: Detalhes da peça com ajuste pendente
    dado:
      - que alterei a quantidade de uma peça sem confirmar
    quando:
      - aciono o nome da peça
    entao:
      - a visualização de detalhes apresenta nome, descrição, código, quantidade, situação e a ação de editar
      - a quantidade exibida reflete o ajuste pendente
    e_quando:
      - aciono a ação de editar
    e_entao:
      - a tela de edição é aberta com a peça correspondente selecionada

  - id: CN-11
    titulo: Cadastro com campo obrigatório vazio
    dado:
      - que estou no formulário de cadastro de peça
    quando:
      - deixo vazio ao menos um campo obrigatório, como nome, código, categoria, descrição, limite de estoque ou quantidade
      - aciono o cadastro
    entao:
      - os campos inválidos recebem marcação de erro
      - vejo o aviso de que todos os campos devem ser preenchidos
      - nenhuma peça é registrada

  - id: CN-12
    titulo: Valor opcional e formatos numéricos
    dado:
      - que estou no formulário de cadastro de peça
    quando:
      - deixo o campo de valor sem preenchimento
      - informo os demais campos obrigatórios
      - aciono o cadastro
    entao:
      - o cadastro é aceito
    e_quando:
      - informo valor com mais de duas casas decimais, limite de estoque com decimais ou quantidade com zero, valor negativo ou letras
    e_entao:
      - o campo recusa os caracteres ou valores incompatíveis com sua regra

  - id: CN-13
    titulo: Cadastro válido de peça
    dado:
      - que preenchi todos os campos obrigatórios com dados válidos
    quando:
      - aciono o cadastro
    entao:
      - vejo a confirmação de que a peça foi cadastrada com sucesso
      - a peça passa a ser considerada nas demais áreas do sistema

  - id: CN-14
    titulo: Edição sem peça selecionada
    dado:
      - que abri o formulário de edição
    quando:
      - tento salvar sem selecionar uma peça
    entao:
      - vejo o convite de seleção como primeira opção do seletor
      - os campos inválidos recebem marcação de erro
      - vejo o aviso de que todos os campos devem ser preenchidos
      - nenhuma alteração é salva

  - id: CN-15
    titulo: Carregamento de peça para edição
    dado:
      - que estou no formulário de edição
    quando:
      - seleciono uma peça no seletor
    entao:
      - nome, código, categoria, descrição, valor, quantidade e limite de estoque são preenchidos com os dados da peça
      - a identificação visual acompanha a peça selecionada
    e_quando:
      - preencho os campos e salvo
    e_entao:
      - vejo a confirmação de peça atualizada com sucesso
      - os dados atualizados passam a valer nas demais áreas

  - id: CN-16
    titulo: Abertura da área de cobranças
    dado:
      - que estou autenticada
    quando:
      - aciono cobranças na navegação
    entao:
      - a visão de cobranças registradas é apresentada primeiro
      - cada cobrança registrada aparece em seu cartão com os dados do cliente, itens, vencimento, progresso e situação

  - id: CN-17
    titulo: Cadastro de cobrança incompleto
    dado:
      - que estou no cadastro de cobrança
    quando:
      - deixo ausente algum dado obrigatório, incluindo ao menos uma peça
      - aciono a conclusão
    entao:
      - vejo o aviso para preencher todos os dados da cobrança
      - a cobrança não é registrada

  - id: CN-18
    titulo: Composição de cobrança acima do estoque
    dado:
      - que uma peça possui quantidade disponível no estoque
    quando:
      - informo uma quantidade maior que a disponível para essa peça
    entao:
      - a inclusão é recusada
      - o sistema informa a disponibilidade atual
    e_quando:
      - adiciono a mesma peça novamente respeitando o limite
    e_entao:
      - as quantidades da peça aparecem somadas em uma única linha
      - a soma não ultrapassa o estoque disponível

  - id: CN-19
    titulo: Remoção de peça da cobrança
    dado:
      - que adicionei peças ao cadastro de cobrança
    quando:
      - removo uma das peças antes de concluir
    entao:
      - a peça sai da composição
      - as demais peças e quantidades permanecem como estavam

  - id: CN-20
    titulo: Cobrança cadastrada
    dado:
      - que informei todos os dados obrigatórios e ao menos uma peça com quantidade válida
    quando:
      - concluo o cadastro
    entao:
      - vejo a confirmação de cobrança cadastrada com sucesso
      - sou levada de volta à visão de cobranças registradas
      - a nova cobrança aparece registrada com situação em aberto

  - id: CN-21
    titulo: Situação por vencimento
    dado:
      - que uma cobrança está em aberto
    quando:
      - a data limite está a até sete dias, incluindo o dia atual
      - ou a data limite já foi ultrapassada
    entao:
      - o cartão é sinalizado como próximo do vencimento no primeiro caso
      - o cartão é sinalizado como vencido no segundo caso
      - a situação é atualizada automaticamente enquanto a tela permanece aberta

  - id: CN-22
    titulo: Baixa de parcela
    dado:
      - que uma cobrança parcelada está em aberto
    quando:
      - aciono a baixa de uma parcela
    entao:
      - o progresso avança uma unidade
      - o número de parcelas pagas é atualizado no cartão
    e_quando:
      - todas as parcelas forem baixadas
    e_entao:
      - a cobrança passa a ser sinalizada como concluída
      - novas baixas não ultrapassam o total de parcelas

  - id: CN-23
    titulo: Baixa total com confirmação
    dado:
      - que uma cobrança em aberto permite baixa total
    quando:
      - aciono a baixa total
    entao:
      - vejo um modal de confirmação com o nome do cliente, a informação de que o registro permanece no histórico, a ação de cancelar e a ação de confirmar
    e_quando:
      - aciono cancelar
    e_entao:
      - a cobrança permanece em aberto e sem alteração
    e_quando:
      - aciono confirmar baixa total
    e_entao:
      - a cobrança é marcada como totalmente paga
      - o registro continua visível no histórico

  - id: CN-24
    titulo: Filtro de período no dashboard
    dado:
      - que estou no dashboard
    quando:
      - seleciono últimos 15 dias ou últimos 30 dias
    entao:
      - os indicadores e os gráficos passam a refletir o período escolhido
      - o total de produtos vendidos, a categoria mais vendida e a peça sem saída permanecem visíveis

  - id: CN-25
    titulo: Uso em tela pequena
    dado:
      - que a janela tem menos de 800 px de largura
    quando:
      - navego pelas áreas do sistema
    entao:
      - a navegação é acessada por menu sobreposto
      - pesquisa e filtro ficam empilhados ocupando toda a largura
      - a lista de peças oculta as colunas secundárias mantendo a identificação do item
      - formulários, abas, cartões, indicadores e gráficos são empilhados
      - pop-ups e modais ocupam a largura disponível com margens laterais

  - id: CN-26
    titulo: Encerramento da sessão
    dado:
      - que estou autenticada em uma área interna
    quando:
      - aciono a ação de sair
    entao:
      - a sessão é encerrada
      - sou levada à tela de login
      - as áreas internas deixam de estar acessíveis até nova autenticação

  - id: CN-27
    titulo: Recarga da aplicação
    dado:
      - que cadastrei peças, ajustei quantidades e registrei cobranças
    quando:
      - recarrego a aplicação
    entao:
      - os dados voltam ao conjunto inicial do protótipo
      - nenhuma informação é recuperada de backend, API ou banco de dados

  - id: CN-28
    titulo: Máscara de CPF no login
    dado:
      - que estou na tela de login
    quando:
      - digito apenas dígitos no campo de identificação
    entao:
      - o valor é formatado como ###.###.###-##
      - a digitação não é bloqueada
    e_quando:
      - digito um e-mail com arroba
    e_entao:
      - o texto é preservado sem máscara

  - id: CN-29
    titulo: Máscara de telefone no cadastro de cobrança
    dado:
      - que estou no cadastro de cobrança
    quando:
      - digito apenas dígitos no campo de telefone
    entao:
      - o valor é formatado como (DD)-NNNNN-NNNN
      - a digitação não é bloqueada

  - id: CN-30
    titulo: Cadastro de cobrança com campo inválido
    dado:
      - que estou no cadastro de cobrança
    quando:
      - preencho todos os campos, mas um deles tem valor inválido, como CPF com dígitos verificadores errados, telefone incompleto ou data anterior ao dia atual
      - aciono a conclusão
    entao:
      - os campos inválidos recebem borda vermelha
      - vejo o pop-up de preenchimento incorreto
      - a cobrança não é registrada

  - id: CN-31
    titulo: Data limite inválida na cobrança
    dado:
      - que estou no cadastro de cobrança
    quando:
      - informo uma data limite anterior ao dia atual ou em formato inválido
    entao:
      - o campo de data recebe borda vermelha
      - vejo o pop-up de preenchimento incorreto
      - a cobrança não é registrada
